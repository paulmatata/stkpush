<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudP Tech Services - M-Pesa Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #10B981;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
<div class="bg-white-700 max-w-md w-150 border border-black-900">
    <div class="image-center mb-6">
        <img href="cloudptech.png" alt="cloudptech logo">
    </div>
</div>
    <div class="max-w-md w-full bg-gray-800 rounded-2xl shadow-2xl p-6 border border-gray-700">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-green-400">CloudP Tech Services</h1>
            <p class="text-gray-400 text-sm mt-1">Instant M-Pesa Payment Portal</p>
        </div>

        <!-- Order Summary -->
        <div class="bg-gray-700/50 rounded-lg p-4 mb-6 border border-gray-600">
            <div class="flex justify-between items-center text-sm">
                <span class="text-gray-300">Test Item</span>
                <span class="font-semibold">Sandbox Verification Charge</span>
            </div>
            <div class="flex justify-between items-center text-lg font-bold mt-2">
                <span>Amount</span>
                <span class="text-green-400">KES 1.00</span>
            </div>
        </div>

        <!-- Form -->
        <form id="paymentForm" onsubmit="handlePayment(event)" class="space-y-4">
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-300 mb-1">
                    M-Pesa Phone Number
                </label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    placeholder="0712345678" 
                    required 
                    class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none text-white text-lg tracking-wide"
                >
                <p class="text-xs text-gray-400 mt-1">Format: 07XXXXXXXX or 01XXXXXXXX</p>
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-green-500 hover:bg-green-600 text-black font-bold py-3 rounded-lg transition duration-200 flex items-center justify-center space-x-2"
            >
                <span id="btnText">Pay KES 1 via M-Pesa</span>
                <div id="btnSpinner" class="loader hidden"></div>
            </button>
        </form>

        <!-- Status Box -->
        <div id="statusBox" class="mt-4 hidden p-4 rounded-lg text-sm border"></div>

        <div class="mt-6 text-center text-xs text-gray-500">
            Powered by Safaricom Daraja API
        </div>
    </div>

    <script>
        let pollingInterval = null;

        async function handlePayment(event) {
            event.preventDefault();

            const phoneInput = document.getElementById('phone').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // UI Loading state
            submitBtn.disabled = true;
            btnText.textContent = "Initiating...";
            btnSpinner.classList.remove('hidden');
            showStatus('info', 'Sending STK Push prompt to your phone...');

            try {
                // Prepare Form Data
                const formData = new FormData();
                formData.append('phone', phoneInput);

                // FIRST FETCH: Trigger STK Push
                const response = await fetch('stk_push.php', {
                    method: 'POST',
                    body: formData
                });

                const responseText = await response.text();
                console.log("Raw STK Response:", responseText); // Debugging log

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    throw new Error("Invalid server response. Check browser console for raw output.");
                }

                if (data.status === 'success') {
                    showStatus('info', data.message + ' Waiting for PIN entry...');
                    btnText.textContent = "Awaiting PIN...";
                    
                    // START SECOND FETCH: Poll Status
                    startPolling(data.checkout_id);
                } else {
                    resetBtn();
                    showStatus('error', 'Initiation Failed: ' + (data.message || 'Unknown error'));
                }

            } catch (error) {
                console.error("Payment Error:", error);
                resetBtn();
                showStatus('error', error.message);
            }
        }

        function startPolling(checkoutId) {
            let attempts = 0;
            const maxAttempts = 20; // Poll for 60 seconds (every 3s)

            if (pollingInterval) clearInterval(pollingInterval);

            pollingInterval = setInterval(async () => {
                attempts++;

                if (attempts > maxAttempts) {
                    clearInterval(pollingInterval);
                    resetBtn();
                    showStatus('error', 'Transaction timed out. If you entered your PIN, please check your SMS.');
                    return;
                }

                try {
                    // SECOND FETCH: Poll Database Status
 // Inside startPolling(checkoutId) in index.html:

const res = await fetch(`status.php?checkout_id=${encodeURIComponent(checkoutId)}`);
const resText = await res.text();
console.log("Polling output:", resText);

let data = JSON.parse(resText);

if (data.status === 'SUCCESS') {
    clearInterval(pollingInterval);
    resetBtn();
    showStatus('success', `Payment Successful! Receipt: ${data.receipt}`);
} else if (data.status === 'FAILED') {
    clearInterval(pollingInterval);
    resetBtn();
    showStatus('error', `Payment Failed: ${data.message}`);
}
// If status is 'PENDING', keep polling automatically...
                    // If still 'PENDING', keep polling...

                } catch (err) {
                    console.error("Polling Error:", err);
                }
            }, 3000);
        }

        function showStatus(type, message) {
            const statusBox = document.getElementById('statusBox');
            statusBox.classList.remove('hidden', 'bg-red-900/40', 'border-red-600', 'text-red-200', 'bg-green-900/40', 'border-green-600', 'text-green-200', 'bg-blue-900/40', 'border-blue-600', 'text-blue-200');

            if (type === 'error') {
                statusBox.classList.add('bg-red-900/40', 'border-red-600', 'text-red-200');
            } else if (type === 'success') {
                statusBox.classList.add('bg-green-900/40', 'border-green-600', 'text-green-200');
            } else {
                statusBox.classList.add('bg-blue-900/40', 'border-blue-600', 'text-blue-200');
            }

            statusBox.innerHTML = message;
        }

        function resetBtn() {
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            submitBtn.disabled = false;
            btnText.textContent = "Pay KES 1 via M-Pesa";
            btnSpinner.classList.add('hidden');
        }
    </script>
</body>
</html>
